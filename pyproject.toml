[project]
name = "ekisqa"
version = "0.1.0"
description = "Rule-based QA framework for German compensation-area registers, with Brandenburg as the reference profile"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "pyogrio>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
cli = [
    "typer>=0.12",
]

[project.scripts]
ekis-qa = "cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ekisqa*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
